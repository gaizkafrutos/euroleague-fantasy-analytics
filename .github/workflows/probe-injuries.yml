name: Sonda de fuentes de lesiones (temporal)

# Diagnóstico de una sola vez: qué fuentes de lesiones responden desde los
# runners de GitHub (BasketNews devuelve 403) y si la API del Fantasy trae el
# estado de cada jugador. No escribe nada en el repositorio.
on:
  pull_request:
    paths: [".github/workflows/probe-injuries.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fuentes públicas
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
          urls = [
            "https://basketnews.com/news-212393-euroleague-injury-report-updated.html",
            "https://basketnews.com/leagues/25-euroleague/injured.html",
            "https://www.rotowire.com/euro/tables/injury-report.php?team=ALL&pos=ALL",
            "https://basketballsphere.com/en/injuries/euroleague/",
            "https://www.euroleaguebasketball.net/en/euroleague/news/injury-report-round-1-tae2526/",
            "https://sportando.basketball/en/euroleague-injury-report-round-1-outs-and-questionable-players-for-september-25/",
          ]
          for url in urls:
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "text/html,application/json;q=0.9,*/*;q=0.8", "Accept-Language": "en-US,en;q=0.9"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read()
                      print(f"{r.status} {len(body):>7}B server={r.headers.get('server')} {url}")
              except urllib.error.HTTPError as e:
                  body = e.read()[:300].decode("utf-8", "ignore").replace("\n", " ")
                  print(f"{e.code} server={e.headers.get('server')} cf-ray={e.headers.get('cf-ray')} {url} :: {body[:160]}")
              except Exception as e:
                  print(f"ERR {type(e).__name__} {url} :: {e}")
          PY

      - name: API del Fantasy (estado de jugador)
        env:
          FANTAKING_TOKEN: ${{ secrets.FANTAKING_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          BASE = "https://fantaking-api.dunkest.com/api/v1"
          H = {"Authorization": f"Bearer {os.environ['FANTAKING_TOKEN']}", "Origin": "https://euroleaguefantasy.euroleaguebasketball.net",
               "Referer": "https://euroleaguefantasy.euroleaguebasketball.net/", "Accept": "application/json"}
          def get(path):
              req = urllib.request.Request(BASE + path, headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, None
          st, body = get("/competitions/49/stats/players/table?stats_type=avg&page=1&per_page=3&sort_by=fpt&sort_order=desc&active_players=true&quotations=0,30")
          print("market", st)
          if body:
              data = body["data"]
              print("columns:", data["columns"])
              p = data["players"][0]
              print("claves del jugador:", {k: (v if k != "row" else "...") for k, v in p.items()})
              pid = p["id"]
          else:
              pid = 3766
          for path in [f"/competitions/49/players/{pid}", f"/players/{pid}", f"/competitions/49/players?per_page=2",
                       "/competitions/49/players/injured", "/competitions/49/injuries", f"/competitions/49/players/{pid}/stats",
                       "/competitions/49/matchdays", "/competitions/49/current-matchday"]:
              st, body = get(path)
              text = json.dumps(body)[:100000] if body is not None else ""
              hits = sorted(set(m.lower() for m in re.findall(r'"([a-zA-Z_]*(?:injur|status|availab|infortun|squalif|out)[a-zA-Z_]*)"', text)))
              print(f"{st} {path} claves={list(body)[:8] if isinstance(body, dict) else type(body).__name__} campos_estado={hits[:12]}")
              if body is not None and hits:
                  i = text.lower().find(hits[0])
                  print("   ...", text[max(0, i-200):i+300])
          PY
