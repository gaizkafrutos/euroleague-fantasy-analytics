name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -e "./pipeline[dev]"
      - name: Tests
        run: python -m pytest pipeline/tests -q
      - name: Lint
        run: ruff check pipeline

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Comprobación de tipos
        run: npm run typecheck
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que no hay tokens en el repo
        run: |
          # El token de Fantaking es de la forma "1234567|cadena_larga".
          if grep -rInE '[0-9]{5,9}\|[A-Za-z0-9]{30,}' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next . ; then
            echo "::error title=Posible token en el repositorio::Se ha encontrado algo con forma de token de Fantaking."
            exit 1
          fi
          echo "Sin tokens a la vista."
