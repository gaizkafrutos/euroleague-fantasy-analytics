name: Captura de datos

# Cuatro capturas al día, lejos del minuto 0 (el más saturado de Actions: el
# cron de las 07:00 llegaba entre las 11:47 y las 13:38). El juego aplica la
# revalorización al cerrar la jornada, de madrugada; con una sola captura a
# mediodía la J1 se quedó 16 h con los precios de antes de jugarse. Las
# capturas sin cambios no se guardan (ver `same_market`), así que el histórico
# no se llena de puntos repetidos.
on:
  schedule:
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      label:
        description: 'Etiqueta del snapshot, por ejemplo "R03"'
        required: false
        type: string

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar el pipeline
        run: pip install -e ./pipeline

      - name: Ingerir datos oficiales
        run: python -m efa ingest-official

      # BasketNews actualiza el parte a diario. Si la página cambia o no
      # responde, el build sigue con el último parte guardado.
      - name: Parte de lesiones
        id: injuries
        run: python -m efa injuries
        continue-on-error: true

      - name: Capturar precios del Fantasy
        id: snapshot
        env:
          FANTAKING_TOKEN: ${{ secrets.FANTAKING_TOKEN }}
        run: python -m efa snapshot ${{ inputs.label && format('--label {0}', inputs.label) || '' }}
        continue-on-error: true

      - name: Avisar si el token ha caducado
        if: steps.snapshot.outcome == 'failure'
        run: |
          echo "::error title=Sin precios nuevos::No se pudieron capturar los precios." \
               "Si es un 401, renueva FANTAKING_TOKEN en Settings > Secrets and variables > Actions." \
               "Instrucciones en docs/TOKEN.md."

      - name: Reconstruir los datos de la web
        run: python -m efa build

      - name: Verificar la fórmula de puntuación
        run: python -m efa verify || true

      - name: Commitear los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/src/data
          if git diff --staged --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "datos: snapshot $(date -u +'%Y-%m-%d %H:%M')"
            # Con cuatro ejecuciones al día puede haber entrado otro push mientras
            # tanto: se rebasa el commit de datos encima en vez de fallar.
            git pull --rebase origin main
            git push
          fi

      # Las estadísticas se commitean igual, pero la ejecución sale en rojo: un
      # aviso amarillo no lo ve nadie y la web se quedaba con precios viejos.
      - name: Fallar si no hubo precios nuevos
        if: steps.snapshot.outcome == 'failure'
        run: exit 1

      - name: Avisar si el parte de lesiones no se actualizó
        if: steps.injuries.outcome == 'failure'
        run: echo "::warning title=Parte de lesiones::BasketNews no respondió; se usa el último parte guardado."
